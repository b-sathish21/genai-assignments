$kind: collection
name: GenAI-Sep
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{vault:groq_api_key_1clb}}'
scripts:
  - type: 'http:afterResponse'
    language: text/javascript
    code: |-
      // ── 429 Auto-Retry with Exponential Back-off ──────────────────────────
      const MAX_RETRIES   = 3;
      const BASE_DELAY_MS = 2000;   // 2 s initial wait; doubles each attempt

      if (pm.response.code === 429) {
          const retryCount = pm.variables.get('_retryCount_' + pm.info.requestId) || 0;

          if (retryCount < MAX_RETRIES) {
              const nextRetry = parseInt(retryCount) + 1;
              const delay     = BASE_DELAY_MS * Math.pow(2, retryCount); // 2s, 4s, 8s

              // Honour Retry-After header when the server sends one
              const retryAfterHeader = pm.response.headers.get('Retry-After');
              const waitMs = retryAfterHeader
                  ? parseInt(retryAfterHeader) * 1000
                  : delay;

              console.log(
                  '[429 Retry] ' + pm.info.requestName +
                  ' — attempt ' + nextRetry + '/' + MAX_RETRIES +
                  ', waiting ' + waitMs + ' ms'
              );

              pm.variables.set('_retryCount_' + pm.info.requestId, nextRetry);

              // Wait, then re-run the same request
              setTimeout(function () {
                  pm.execution.setNextRequest(pm.info.requestName);
              }, waitMs);

          } else {
              // Exhausted retries — clear counter and move on
              pm.variables.unset('_retryCount_' + pm.info.requestId);
              console.warn(
                  '[429 Retry] ' + pm.info.requestName +
                  ' — max retries reached, skipping.'
              );
          }
      } else {
          // Successful (non-429) response — reset counter for this request
          pm.variables.unset('_retryCount_' + pm.info.requestId);
      }
      // ─────────────────────────────────────────────────────────────────────
