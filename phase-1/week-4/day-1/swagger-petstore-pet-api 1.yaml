swagger: '2.0'
info:
  title: Swagger Petstore - Pet API
  description: |
    Swagger 2.0 definition for the Pet operations from the Swagger Petstore sample API.
    Base URL: https://petstore.swagger.io/v2
  version: '1.0.7'
  contact:
    email: apiteam@swagger.io
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
host: petstore.swagger.io
basePath: /v2
schemes:
  - https
  - http
consumes:
  - application/json
produces:
  - application/json
  - application/xml

tags:
  - name: pet
    description: Everything about your pets

paths:
  /pet:
    post:
      tags: [pet]
      summary: Add a new pet to the store
      operationId: addPet
      consumes:
        - application/json
        - application/xml
      parameters:
        - in: body
          name: body
          description: Pet object that needs to be added to the store
          required: true
          schema:
            $ref: '#/definitions/Pet'
      responses:
        '405':
          description: Invalid input
      security:
        - petstore_auth:
            - write:pets
            - read:pets

    put:
      tags: [pet]
      summary: Update an existing pet
      operationId: updatePet
      consumes:
        - application/json
        - application/xml
      parameters:
        - in: body
          name: body
          description: Pet object that needs to be updated
          required: true
          schema:
            $ref: '#/definitions/Pet'
      responses:
        '400':
          description: Invalid ID supplied
        '404':
          description: Pet not found
        '405':
          description: Validation exception
      security:
        - petstore_auth:
            - write:pets
            - read:pets

  /pet/findByStatus:
    get:
      tags: [pet]
      summary: Find pets by status
      description: Multiple status values can be provided.
      operationId: findPetsByStatus
      parameters:
        - name: status
          in: query
          description: Status values to filter by
          required: true
          type: array
          collectionFormat: multi
          items:
            type: string
            enum:
              - available
              - pending
              - sold
      responses:
        '200':
          description: Successful operation
          schema:
            type: array
            items:
              $ref: '#/definitions/Pet'
        '400':
          description: Invalid status value
      security:
        - petstore_auth:
            - write:pets
            - read:pets

  /pet/findByTags:
    get:
      tags: [pet]
      summary: Find pets by tags
      description: Multiple tags can be provided.
      operationId: findPetsByTags
      deprecated: true
      parameters:
        - name: tags
          in: query
          description: Tags to filter by
          required: true
          type: array
          collectionFormat: multi
          items:
            type: string
      responses:
        '200':
          description: Successful operation
          schema:
            type: array
            items:
              $ref: '#/definitions/Pet'
        '400':
          description: Invalid tag value
      security:
        - petstore_auth:
            - write:pets
            - read:pets

  /pet/{petId}:
    get:
      tags: [pet]
      summary: Find pet by ID
      description: Returns a single pet
      operationId: getPetById
      parameters:
        - name: petId
          in: path
          description: ID of pet to return
          required: true
          type: integer
          format: int64
      responses:
        '200':
          description: Successful operation
          schema:
            $ref: '#/definitions/Pet'
        '400':
          description: Invalid ID supplied
        '404':
          description: Pet not found
      security:
        - api_key: []

    post:
      tags: [pet]
      summary: Update a pet using form data
      operationId: updatePetWithForm
      consumes:
        - application/x-www-form-urlencoded
      parameters:
        - name: petId
          in: path
          description: ID of pet that needs to be updated
          required: true
          type: integer
          format: int64
        - name: name
          in: formData
          description: Updated pet name
          required: false
          type: string
        - name: status
          in: formData
          description: Updated pet status
          required: false
          type: string
      responses:
        '405':
          description: Invalid input
      security:
        - petstore_auth:
            - write:pets
            - read:pets

    delete:
      tags: [pet]
      summary: Delete a pet
      operationId: deletePet
      parameters:
        - name: api_key
          in: header
          required: false
          type: string
        - name: petId
          in: path
          description: Pet ID to delete
          required: true
          type: integer
          format: int64
      responses:
        '400':
          description: Invalid ID supplied
        '404':
          description: Pet not found
      security:
        - petstore_auth:
            - write:pets
            - read:pets

  /pet/{petId}/uploadImage:
    post:
      tags: [pet]
      summary: Upload an image for a pet
      operationId: uploadFile
      consumes:
        - multipart/form-data
      produces:
        - application/json
      parameters:
        - name: petId
          in: path
          description: ID of pet to update
          required: true
          type: integer
          format: int64
        - name: additionalMetadata
          in: formData
          description: Additional metadata
          required: false
          type: string
        - name: file
          in: formData
          description: Image file to upload
          required: false
          type: file
      responses:
        '200':
          description: Successful operation
          schema:
            $ref: '#/definitions/ApiResponse'
      security:
        - petstore_auth:
            - write:pets
            - read:pets

securityDefinitions:
  api_key:
    type: apiKey
    name: api_key
    in: header
  petstore_auth:
    type: oauth2
    authorizationUrl: https://petstore.swagger.io/oauth/authorize
    flow: implicit
    scopes:
      read:pets: Read your pets
      write:pets: Modify pets in your account

definitions:
  ApiResponse:
    type: object
    properties:
      code:
        type: integer
        format: int32
      type:
        type: string
      message:
        type: string

  Category:
    type: object
    properties:
      id:
        type: integer
        format: int64
      name:
        type: string
    xml:
      name: Category

  Tag:
    type: object
    properties:
      id:
        type: integer
        format: int64
      name:
        type: string
    xml:
      name: Tag

  Pet:
    type: object
    required:
      - name
      - photoUrls
    properties:
      id:
        type: integer
        format: int64
        example: 101
      category:
        $ref: '#/definitions/Category'
      name:
        type: string
        example: doggie
      photoUrls:
        type: array
        items:
          type: string
          example: https://example.com/images/doggie.jpg
        xml:
          wrapped: true
      tags:
        type: array
        items:
          $ref: '#/definitions/Tag'
        xml:
          wrapped: true
      status:
        type: string
        description: Pet status in the store
        enum:
          - available
          - pending
          - sold
        example: available
    xml:
      name: Pet
